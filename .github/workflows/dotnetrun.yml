name: Dotnet Run

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build-check:
    name: ${{ matrix.os-version }}-build-check
    strategy:
      fail-fast: false
      matrix:
        os-version: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os-version }}

    steps:
    - name: Checkout the repo
      uses: actions/checkout@v2
    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '3.1.x'
    - name: Install MCGB
      run: dotnet tool install dotnet-mgcb
      shell: bash
    - name: Install FreeImage on macOS
      if: runner.os == 'macOS'
      run: |
        if ! command -v brew &>/dev/null; then
          echo "Installing Homebrew..."
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
        fi
        echo "Installing FreeImage..."
        brew install freeimage
        
        echo "Finding FreeImage installation path..."
        FREEIMAGE_PATH=$(brew --prefix freeimage)

        echo "Copying FreeImage libraries to /usr/local/lib/..."
        sudo cp -R $FREEIMAGE_PATH/lib/* /usr/local/lib/
      shell: bash
    - name: Build Kirbstomp 
      run: dotnet build

