name: Dotnet Run

on:
  workflow_dispatch:
    branches: [main, SprintTwo, NewWorkflow]
  push:
    branches: [main, SprintTwo, NewWorkflow]
  pull_request:
    branches: [main, SprintTwo]

jobs:
  mac-build-check:
    runs-on: macos-latest

    steps:
    - name: Checkout the repo
      uses: actions/checkout@v2
    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '3.1.x'
    - name: Install MCGB
      run: dotnet tool install dotnet-mgcb
      shell: bash
    # - name: Rebuilding Game content
    #   run: dotnet mgcb -r Content/Content.mgcb
    #   shell: bash
    - name: Run Kirbstomp 
      run: dotnet run 

