name: Dotnet Run

on:
  workflow_dispatch:
    branches: [main, SprintTwo, NewWorkflow]
  push:
    branches: [main, SprintTwo, NewWorkflow]
  pull_request:
    branches: [main, SprintTwo]

jobs:
  mac-build-check:
    strategy:
      fail-fast: false
      matrix:
        os-version: [ubuntu-latest. windows-latest, macos-latest]
    runs-on: ${{ matrix.os-version }}

    steps:
    - name: Checkout the repo
      uses: actions/checkout@v2
    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '3.1.x'
    - name: Install MCGB
      run: dotnet tool install dotnet-mgcb
      shell: bash
    - name: Build Kirbstomp 
      run: dotnet build

